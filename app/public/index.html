<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app/icon-192.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        margin: 0;
        background: #e4e9f0;
        color-scheme: light dark;
      }
      /* Fit the app in the space left below the update banner. */
      #root {
        display: flex;
        flex: 1;
        min-height: 0;
        width: 100%;
        max-width: 900px;
        margin-inline: auto;
        background: #eef2f7;
      }
      #pwa-update:not([hidden]) {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-shrink: 0;
        box-sizing: border-box;
        width: 100%;
        max-width: 900px;
        margin-inline: auto;
        padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px;
        background: #dce8ff;
        color: #183362;
        font: 600 14px system-ui, sans-serif;
      }
      #pwa-reload {
        border: 0;
        border-radius: 8px;
        min-height: 44px;
        padding: 0 12px;
        background: #245ac8;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #111113; }
        #root { background: #000; }
        #pwa-update:not([hidden]) { background: #172642; color: #e6eeff; }
      }
      input[type="datetime-local"], select {
        padding: 6px;
        border: 1px solid #8e8e9380;
        border-radius: 8px;
        font: inherit;
        max-width: 100%;
      }
      :where(button, a, [role="button"], input, select):focus-visible {
        outline: 2px solid #2f6fed;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="pwa-update" hidden>
      <span role="status">Versi baru tersedia</span>
      <button id="pwa-reload" type="button">Muat ulang</button>
    </div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script src="/app/pwa.js" defer></script>
  </body>
</html>
