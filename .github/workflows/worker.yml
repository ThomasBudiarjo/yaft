name: Worker

on:
  push:
    branches: [main]
    paths: [worker/**, app/src/lib/github.ts, app/src/lib/records.ts, .github/workflows/worker.yml]
  pull_request:
    paths: [worker/**, app/src/lib/github.ts, app/src/lib/records.ts, .github/workflows/worker.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push to main waits for the running one.
    concurrency: ${{ github.event_name == 'push' && 'worker-deploy' || github.run_id }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Bundles the worker the way `wrangler deploy` would, without deploying.
      - run: npx wrangler deploy --dry-run --outdir dist
      # Vars come from wrangler.jsonc; GITHUB_CLIENT_SECRET stays as set in Cloudflare.
      - if: github.event_name == 'push'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
